<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Cinema Virtual V1</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: Arial, Helvetica, sans-serif;

    background:
        radial-gradient(circle at top, #292929, #080808);

    color: white;
}


.card {
    width: 430px;
    padding: 45px;
    text-align: center;

    background:
        linear-gradient(
            145deg,
            #252525,
            #0f0f0f
        );

    border-radius: 22px;

    border: 1px solid #333;

    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.08),
        0 20px 50px rgba(0,0,0,0.7);
}


.logo {
    font-size: 60px;
    margin-bottom: 10px;

    filter:
        sepia(1)
        saturate(12)
        hue-rotate(5deg)
        brightness(1.2)
        drop-shadow(0 0 20px #ff8c00);
}


h1 {
    margin: 10px 0 5px;
    font-size: 32px;
    color: #ff9500;
}


.version {
    color: #aaa;
    font-size: 15px;
}


p {
    margin-top: 30px;
    color: #ddd;
    line-height: 1.6;
}


.button {
    display: inline-block;

    margin-top: 25px;
    padding: 15px 30px;

    background:
        linear-gradient(
            135deg,
            #ffb000,
            #ff6a00
        );

    color: #111;

    font-weight: bold;
    text-decoration: none;

    border-radius: 14px;

    box-shadow:
        0 8px 25px rgba(255,140,0,0.35);

    transition: .2s;
}


.button:hover {
    transform: translateY(-3px);

    box-shadow:
        0 12px 35px rgba(255,140,0,0.55);
}


.info {
    margin-top: 25px;

    font-size: 12px;

    color: #777;
}

</style>

</head>

<body>

<div class="card">

    <div class="logo">
        🎬
    </div>

    <h1>
        Cinema Virtual
    </h1>

    <div class="version">
        Versão 1
    </div>

    <p>
        Esta versão hospedada no GitHub não está mais disponível.
        <br><br>
        Para continuar usando o aplicativo, acesse a versão mais recente do Cinema Virtual.
    </p>

    <a class="button" href="https://cinema-virtual-v4.base44.app/v1.html">
        Abrir versão atual
    </a>
    
</div>

</body>
</html>
